[package]
name = "zns-canon"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
# Dev escape hatch: public sealing keys, no attestation. Release-blocked in lib.rs.
non-tee = []

[dependencies]
blake2b_simd = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.10"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sev = { version = "8.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
sha2 = "0.10"
sigstore-trust-root = { version = "0.14", default-features = false }
sigstore-verify = "0.14"
thiserror = "1"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
zip32 = "0.3"
